# .pre-commit-config.yaml
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.4.0
    hooks:
    - id: trailing-whitespace
      exclude: |
        (?x)^(
            tests/data/.*|
            data/.*|
            varalign/lib/aacon/.*
        )$
    - id: end-of-file-fixer
      exclude: (^tests/data/|^data/|^varalign/lib/aacon/)
    - id: check-yaml
    - id: check-added-large-files
-   repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
    - id: black
      args: [--line-length=79]
-   repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
    -   id: flake8
        additional_dependencies: ['flake8-bugbear', 'flake8-import-order']  # Example additional plugins
        args: ['--max-line-length=122', '--ignore=E203,W503', '--exclude=varalign/lib/aacon']
